<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Balance | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="our-logo.png">
</head>
<body>
    <header class="header">
        <a href="homepage.html">
            <img src="our-logo.png" alt="Pure Balance - Holistic Health Logo" class="site-logo">
        </a>
    </header>

    <div class="login-container">
        <h1>Login</h1>
        <h4>Welcome back!</h4>
        
        <form id="loginForm" action="homepage.html">
            <div class="form-group">
                <label for="email">Username/Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>
            
            <div class="auth-buttons">
                <button type="submit" class="btn-login">Log In</button>
            </div>
        </form>
        
        <p>
            Don't have an account? <a href="signup.html">Sign up</a>
        </p>
    </div>

    <footer>
        <p>&copy; 2026 Pure Balance. All rights reserved.</p>
    </footer>
</body>
</html>
