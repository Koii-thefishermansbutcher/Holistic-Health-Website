<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Balance | Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="icon" href="our-logo.png">
</head>
<body> 
    <header class="header">
        <a href="homepage.html">
            <img src="our-logo.png" alt="Pure Balance - Holistic Health Logo" class="site-logo">
        </a>
    </header>

    <main class="signup-container">
        <h1>Sign Up</h1>
        <form action="login.html">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" required>
            </div>

            <div class="terms-container">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">By checking the box, you agree to our 
                    <a href="#">Terms and Conditions</a> and <a href="#">Policy</a>
                </label>
            </div>

            <button href="login.html" type="submit" class="btn-submit">Submit</button>
        </form>

        <p>Already have an account? <a href="login.html" class="login-link">Log In</a></p>
    </main>

    <footer>
        <p>&copy; 2026 Pure Balance. All rights reserved.</p>
    </footer>
</body>
</html>
